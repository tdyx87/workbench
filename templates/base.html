<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}个人工作台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('pwa_manifest') }}">
  <meta name="theme-color" content="#070b12">
  <script>
    /* 深色为默认主题；只有显式选择亮色时才挂 html.light */
    (function () {
      var saved = localStorage.getItem('wb-theme');
      if (saved === 'light') {
        document.documentElement.classList.add('light');
      }
    })();
    function toggleTheme() {
      var isLight = document.documentElement.classList.toggle('light');
      localStorage.setItem('wb-theme', isLight ? 'light' : 'dark');
      var btn = document.querySelector('.theme-toggle');
      if (btn) { btn.textContent = isLight ? '🌙' : '☀️'; }
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { meta.setAttribute('content', isLight ? '#f0f2f5' : '#070b12'); }
    }
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.querySelector('.theme-toggle');
      if (btn) {
        btn.textContent = document.documentElement.classList.contains('light')
          ? '🌙' : '☀️';
      }
    });
  </script>
</head>
<body>

    <div class="container nav-inner">
      <a class="brand" href="{{ url_for('index') }}">🗂 个人工作台</a>
      <div class="nav-links">

        <a href="{{ url_for('work_page') }}" class="{{ 'active' if request.endpoint == 'work_page' }}">工作记录</a>

        <a href="{{ url_for('knowledge.bugs_page') }}" class="{{ 'active' if request.endpoint == 'knowledge.bugs_page' }}">Bug</a>
        <a href="{{ url_for('knowledge.roadmap_page') }}" class="{{ 'active' if request.endpoint == 'knowledge.roadmap_page' }}">学习路线</a>

    {% block content %}{% endblock %}
  </main>
