<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 个人工作台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>🗂 个人工作台</h1>
    <p class="muted">请输入访问密码</p>
    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="password" name="password" placeholder="访问密码" required autofocus>
      <button type="submit" class="btn login-btn">登 录</button>
    </form>
  </div>
</body>
</html>
